# shelfIt runs on its own; the reverse proxy lives in a separate compose project
# (e.g. ~/caddy). shelfIt joins the shared external network "webproxy" so the
# central Caddy container can reach it by name (shelfit:3000) and serve it under
# /shelfit/. Other devices reach Caddy over Tailscale (`tailscale serve` on the
# host, see the README, setup B), so nothing here is exposed to the LAN.
#
# Prerequisite (created once, out-of-band):  docker network create webproxy
services:
  shelfit:
    build: .
    container_name: shelfit
    restart: unless-stopped
    # No host port is published: Caddy reaches the container over the shared
    # network. (For direct LAN access without Caddy, uncomment the ports block.)
    expose:
      - "3000"
    # ports:
    #   - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    # Least privilege: a read-only filesystem except the data volume and a
    # scratch /tmp (cwebp's temp files), and no Linux capabilities except the
    # three the entrypoint needs to hand the data folder to `node` and switch to
    # it (docker-entrypoint.sh); the app itself runs as `node` with none, and
    # no-new-privileges keeps it that way.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - webproxy

networks:
  # Shared, centrally-managed proxy network. Created out-of-band so it persists
  # independently of any single compose project:  docker network create webproxy
  webproxy:
    external: true
